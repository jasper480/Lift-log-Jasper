<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#0a0a0a">
<title>Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --bg-elev: #141414;
    --surface: #1a1a1a;
    --surface-2: #222;
    --border: #2a2a2a;
    --border-strong: #3a3a3a;
    --text: #f5f5f5;
    --text-dim: #999;
    --text-muted: #666;
    --accent: #f59e0b;
    --accent-dim: #92580a;
    --success: #10b981;
    --danger: #ef4444;
    --warn: #fbbf24;
    --shadow: 0 4px 24px rgba(0,0,0,0.6);
    --safe-top: env(safe-area-inset-top, 0);
    --safe-bottom: env(safe-area-inset-bottom, 0);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Instrument Sans', -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    min-height: 100vh;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding-top: var(--safe-top);
    padding-bottom: calc(72px + var(--safe-bottom));
    background:
      radial-gradient(1200px 600px at 50% -200px, rgba(245,158,11,0.06), transparent 70%),
      var(--bg);
    background-attachment: fixed;
  }
  .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; font-weight: 600; }

  /* ---- Layout ---- */
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 24px;
    min-height: calc(100vh - 72px - var(--safe-bottom));
  }
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 8px 0 20px;
  }
  .header h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .header .date {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .view { display: none; }
  .view.active { display: block; }

  /* ---- Cards ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .card-tight { padding: 14px; }
  .card-title {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 12px;
    font-weight: 600;
  }

  /* ---- Buttons ---- */
  .btn {
    appearance: none;
    border: none;
    background: var(--accent);
    color: #1a1100;
    font-family: inherit;
    font-weight: 600;
    font-size: 16px;
    padding: 14px 18px;
    border-radius: 12px;
    cursor: pointer;
    width: 100%;
    transition: transform 0.06s ease, background 0.15s ease;
    letter-spacing: 0.01em;
  }
  .btn:active { transform: scale(0.98); }
  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border-strong);
  }
  .btn-ghost {
    background: var(--surface-2);
    color: var(--text);
  }
  .btn-danger { background: var(--danger); color: white; }
  .btn-success { background: var(--success); color: #001a0e; }
  .btn-sm { padding: 10px 14px; font-size: 14px; }
  .btn-xs { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }

  /* ---- Day picker ---- */
  .day-picker {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 14px;
  }
  .day-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 12px 4px;
    border-radius: 10px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.1em;
    font-weight: 600;
    text-transform: uppercase;
    cursor: pointer;
  }
  .day-pill.active {
    background: var(--accent);
    color: #1a1100;
    border-color: var(--accent);
  }
  .day-pill .recommended-dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    margin-left: 4px;
    vertical-align: middle;
  }
  .day-pill.active .recommended-dot { background: #1a1100; }

  /* ---- Exercise list ---- */
  .ex-progress {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
  }
  .ex-progress-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    transition: background 0.2s;
  }
  .ex-progress-bar.done { background: var(--success); }
  .ex-progress-bar.current { background: var(--accent); }

  .exercise {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--border-strong);
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  /* Rest-tier color coding: green = longest rest, yellow = mid, red = shortest */
  .exercise.tier-green {
    border-left-color: #16a34a;
    background: linear-gradient(100deg, rgba(22,163,74,0.07), transparent 42%), var(--surface);
  }
  .exercise.tier-yellow {
    border-left-color: #d99318;
    background: linear-gradient(100deg, rgba(217,147,24,0.07), transparent 42%), var(--surface);
  }
  .exercise.tier-red {
    border-left-color: #dc2626;
    background: linear-gradient(100deg, rgba(220,38,38,0.07), transparent 42%), var(--surface);
  }
  /* Current exercise: glow via box-shadow so it doesn't fight the tier left-border */
  .exercise.current {
    box-shadow: 0 0 0 1.5px var(--accent-dim) inset, 0 6px 22px rgba(0,0,0,0.5);
    border-top-color: var(--border-strong);
    border-right-color: var(--border-strong);
    border-bottom-color: var(--border-strong);
  }
  .exercise.done { opacity: 0.55; }
  /* Rest-time meta dot colors */
  .rest-meta.rest-green { color: #22c55e; }
  .rest-meta.rest-yellow { color: #e0a82e; }
  .rest-meta.rest-red { color: #ef4444; }
  /* Per-set "last time" reference line */
  .set-wrap { margin-bottom: 2px; }
  .set-last {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    padding: 1px 0 7px 44px;
    letter-spacing: 0.01em;
  }
  .set-last.set-tight { padding-bottom: 1px; }
  .set-last.set-best { color: #fbbf24; }
  /* Drop set (optional) */
  .drop-set {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border-strong);
  }
  .drop-set-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .drop-set-label span { color: var(--accent); letter-spacing: 0.05em; }
  .drop-badge {
    background: var(--accent-dim);
    color: var(--accent);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .drop-row.logged .drop-badge { background: var(--success); color: #001a0e; }
  /* A finished exercise stays fully legible while still expanded (to add a drop set) */
  .exercise.done.open { opacity: 1; }
  /* Tier legend */
  .tier-legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .tier-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .tier-legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .ex-header {
    padding: 16px;
    cursor: pointer;
    user-select: none;
  }
  .ex-row1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .ex-name {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.25;
  }
  .ex-idx {
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .ex-meta {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .ex-meta-item { display: flex; align-items: center; gap: 4px; }
  .ex-suggest {
    margin-top: 10px;
    padding: 8px 10px;
    background: rgba(245,158,11,0.08);
    border: 1px solid rgba(245,158,11,0.25);
    border-radius: 8px;
    color: var(--accent);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ex-notes {
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
    line-height: 1.4;
  }
  .ex-body {
    border-top: 1px solid var(--border);
    padding: 14px 16px 16px;
    display: none;
  }
  .exercise.open .ex-body { display: block; }
  .chev {
    color: var(--text-muted);
    font-size: 18px;
    transition: transform 0.15s;
  }
  .exercise.open .chev { transform: rotate(180deg); }

  /* ---- Set rows ---- */
  .sets-table {
    width: 100%;
  }
  .sets-head {
    display: grid;
    grid-template-columns: 36px 1fr 1fr 64px 36px;
    gap: 8px;
    padding: 4px 2px 8px;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
  }
  .set-row {
    display: grid;
    grid-template-columns: 36px 1fr 1fr 64px 36px;
    gap: 8px;
    align-items: center;
    padding: 6px 0;
  }
  .set-num {
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 600;
    text-align: center;
  }
  .set-row.logged .set-num {
    color: var(--success);
  }
  .set-input {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    padding: 10px 8px;
    border-radius: 8px;
    text-align: center;
    width: 100%;
    -moz-appearance: textfield;
  }
  .set-input::-webkit-outer-spin-button,
  .set-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .set-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .rir-select {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 15px;
    padding: 10px 4px;
    border-radius: 8px;
    text-align: center;
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
  }
  .log-btn {
    background: var(--accent);
    border: none;
    color: #1a1100;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 700;
    width: 36px;
    height: 40px;
    cursor: pointer;
  }
  .log-btn.logged {
    background: var(--success);
    color: #001a0e;
  }
  .ex-notes-input {
    width: 100%;
    margin-top: 10px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px;
    border-radius: 8px;
    resize: vertical;
    min-height: 60px;
  }
  .ex-notes-input:focus { outline: none; border-color: var(--accent); }

  /* ---- Rest Timer ---- */
  .rest-bar {
    margin-top: 12px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .rest-bar .rest-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .rest-bar .rest-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
  }
  .rest-bar .rest-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
  }
  .rest-bar.active .rest-time { color: var(--accent); }
  .rest-bar.done .rest-time { color: var(--success); }
  .rest-bar .rest-actions { display: flex; gap: 6px; }

  /* Big rest timer overlay */
  .timer-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    text-align: center;
  }
  .timer-overlay.show { display: flex; }
  .timer-overlay.flash {
    animation: flash 0.4s ease 3;
  }
  @keyframes flash {
    0%, 100% { background: var(--bg); }
    50% { background: var(--accent); }
  }
  .timer-big {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(80px, 28vw, 140px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--accent);
  }
  .timer-overlay.done .timer-big { color: var(--success); }
  .timer-label {
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
    font-weight: 600;
  }
  .timer-target {
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    margin-top: 12px;
  }
  .timer-actions {
    display: flex;
    gap: 10px;
    margin-top: 40px;
    width: 100%;
    max-width: 320px;
  }
  .timer-actions .btn { flex: 1; }

  /* ---- Bottom nav ---- */
  .nav {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 0 calc(8px + var(--safe-bottom));
    z-index: 50;
  }
  .nav-item {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-muted);
    padding: 8px 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-family: inherit;
  }
  .nav-item.active { color: var(--accent); }
  .nav-icon {
    width: 22px; height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .nav-label {
    font-size: 10px;
    letter-spacing: 0.08em;
    font-weight: 600;
    text-transform: uppercase;
  }

  /* ---- Lists / History ---- */
  .list-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .list-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .list-item-meta {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 4px;
  }
  .list-item-title { font-weight: 600; font-size: 15px; }

  /* ---- Bodyweight ---- */
  .bw-input-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    align-items: center;
  }
  .bw-input {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 600;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    width: 100%;
  }
  .bw-input:focus { outline: none; border-color: var(--accent); }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
  }
  .stat-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
  }
  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    margin-top: 2px;
  }

  /* ---- Charts ---- */
  .chart-wrap {
    height: 220px;
    position: relative;
    margin-top: 6px;
  }
  .chart-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
    background: var(--bg-elev);
    padding: 4px;
    border-radius: 10px;
  }
  .chart-tab {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .chart-tab.active {
    background: var(--surface-2);
    color: var(--text);
  }

  /* ---- Run logging ---- */
  .run-type-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .run-type {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 14px 8px;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    font-weight: 600;
    font-size: 13px;
  }
  .run-type.active {
    background: var(--accent);
    color: #1a1100;
    border-color: var(--accent);
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .form-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 4px;
  }

  /* ---- Misc ---- */
  .toast {
    position: fixed;
    bottom: calc(80px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border-strong);
    padding: 10px 16px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }

  .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 20px;
    font-size: 14px;
  }
  .empty-icon {
    font-size: 32px;
    opacity: 0.4;
    margin-bottom: 8px;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 16px 0;
  }
  .small { font-size: 12px; color: var(--text-muted); }
  .danger-text { color: var(--danger); }
  .accent-text { color: var(--accent); }
  .success-text { color: var(--success); }

  /* Welcome screen */
  .welcome {
    text-align: center;
    padding: 60px 20px 20px;
  }
  .welcome h2 {
    font-size: 22px;
    margin: 0 0 8px;
    font-weight: 700;
  }
  .welcome p {
    color: var(--text-dim);
    margin: 0 0 24px;
  }

  /* Workout summary modal */
  .summary-stat {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .summary-stat:last-child { border-bottom: none; }
  .summary-stat .label { color: var(--text-dim); font-size: 14px; }
  .summary-stat .value { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px; }

  /* PR badge */
  .pr-badge {
    display: inline-block;
    background: var(--accent);
    color: #1a1100;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* Detail view */
  .detail-back {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: inherit;

const STORAGE_KEY = "liftlog_v1";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const merged = { ...defaultState(), ...parsed };
    // Migrate any in-progress workout from v1 (no stretches/addons fields)
    if (merged.current) {
      if (!merged.current.stretches) merged.current.stretches = {};
      if (!merged.current.core) merged.current.core = {};
      if (merged.current.addons == null) merged.current.addons = "";
      (merged.current.exercises || []).forEach(ex => {
        if (!ex.dropSet) ex.dropSet = { weight: null, reps: null, rir: null, logged: false };
      });
    }
    return merged;
  } catch (e) {
    console.error("Load failed", e);
    return defaultState();
  }
}

function defaultState() {
  return {
    workouts: [],         // completed workouts
    current: null,        // in-progress workout
    bodyweight: [],       // [{date, weight}]
    runs: [],             // [{date, type, distance, time, notes}]
    legAlternator: "squat", // deprecated — squat & hex DL now both run every leg day
    dailyCheckins: []     // [{date, hrv, steps, bodyBattery, sleepScore, hydration, notes}]
  };
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    toast("Save failed: storage full?");
  }
}

let state = loadState();

// Parse "YYYY-MM-DD" as a LOCAL date. new Date("2026-06-09") is interpreted as
// UTC midnight, which displays as June 8 in US time zones — that was the
// check-in date glitch. Full ISO timestamps still parse normally.
function parseLocalDate(d) {
  if (typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d)) {
    const [y, m, day] = d.split("-").map(Number);
    return new Date(y, m - 1, day);
  }
  return new Date(d);
}
function fmtDate(d) {
  return parseLocalDate(d).toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function fmtDateLong(d) {
  return parseLocalDate(d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}
function fmtTimeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 3600) return Math.floor(diff/60) + "m ago";
  if (diff < 86400) return Math.floor(diff/3600) + "h ago";
  return Math.floor(diff/86400) + "d ago";
}
function localIsoDate(input) {
  // LOCAL calendar date for any date/timestamp, not UTC. toISOString() flips
  // to tomorrow after ~7 PM in Green Bay, which stamped evening check-ins
  // (and CSV-exported evening workouts) with the next day's date.
  const d = input ? new Date(input) : new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function todayIsoDate() {
  return localIsoDate();
}
// Escape user-typed text before injecting into HTML (notes, reflections).
function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmtMMSS(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ":" + String(s).padStart(2, "0");
}
function est1RM(weight, reps) {
  // Epley formula
  if (!weight || !reps) return 0;
  if (reps === 1) return weight;
  return Math.round(weight * (1 + reps / 30));
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 1800);
}
function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

// ============================================================================
// STRENGTH PERCENTILES — vs ALL GYM-GOERS
// Static snapshot of StrengthLevel one-rep-max standards (overall adult male
// and female, lb — these "overall" rows already average across bodyweights).
// Anchors are 1RM at Beginner/Novice/Intermediate/Advanced/Elite = stronger
// than 5/20/50/80/95% of lifters who log that lift. Pulled June 2026.
//
// The comparison population is modeled as "everyone at the gym":
//   - GYM_POP.femaleShare : fraction of gym-goers who are women
//   - GYM_POP.casualShare : fraction (within each sex) who don't seriously
//       train barbell lifts — modeled as ~30% weaker at the same percentile
// Tweak these constants to make the scale harder or easier.
// ============================================================================
const GYM_POP = { femaleShare: 0.5, casualShare: 0.5, casualFactor: 1.45 };

const STRENGTH_STD = {
  bench:    { label: "Bench Press",    male: [103, 154, 217, 291, 372], female: [38, 69, 111, 164, 223] },
  squat:    { label: "Squat",          male: [141, 206, 287, 381, 483], female: [65, 107, 161, 227, 300] },
  deadlift: { label: "Deadlift",       male: [173, 246, 336, 440, 552], female: [84, 132, 193, 265, 345] },
  shoulder: { label: "Shoulder Press", male: [66, 99, 142, 192, 248],   female: [28, 48, 75, 107, 143] },
  row:      { label: "Bent-Over Row",  male: [89, 133, 188, 253, 323],  female: [34, 58, 91, 130, 175] },
  curl:     { label: "Barbell Curl",   male: [38, 66, 103, 149, 201],   female: [14, 31, 54, 85, 120] },
  latpull:  { label: "Lat Pulldown",   male: [85, 127, 180, 243, 312],  female: [43, 68, 101, 137, 176] }
};

// Map app exercises to a standard. `factor` scales the logged load to a
// barbell-equivalent before estimating 1RM. Jasper logs the TOTAL weight moved
// (both dumbbells summed on two-arm lifts, e.g. 230 = two 115s; single-arm
// lifts logged per arm), so the entered number is already the comparison load
// and factor stays 1 everywhere. `factor` kept in case a per-hand lift is added.
const STD_MAP = {
  "DB Bench Press":           { std: "bench",    factor: 1 },
  "Smith Bench Press (flat)": { std: "bench",    factor: 1 },
  "Seated DB Shoulder Press": { std: "shoulder", factor: 1 },
  "Back Squat":               { std: "squat",    factor: 1 },
  "Hex Bar Deadlift":         { std: "deadlift", factor: 1 },
  "Bent Barbell Row":         { std: "row",      factor: 1 },
  "Barbell or DB Curl":       { std: "curl",     factor: 1 },
  "Lat Pulldown (neutral, narrow)": { std: "latpull", factor: 1 },
  "Weighted Pull-Up / Lat Pulldown": { std: "latpull", factor: 1 }
};

function formatTopPct(tp) {
  if (tp >= 1) return "Top " + Math.round(tp) + "%";
  if (tp >= 0.2) return "Top " + tp.toFixed(1) + "%";
  return "Top 0.1%";
}

// "Stronger than" % within one anchor set, with extrapolation past Elite.
function cdfFromAnchors(x, pts) {
  const [beg, nov, int_, adv, elite] = pts;
  const a = [
    { st: 1,    w: beg * 0.55 },
    { st: 5,    w: beg },
    { st: 20,   w: nov },
    { st: 50,   w: int_ },
    { st: 80,   w: adv },
    { st: 95,   w: elite },
    { st: 99,   w: elite + (elite - adv) * 1.1 },
    { st: 99.9, w: elite + (elite - adv) * 2.4 }
  ];
  if (x <= a[0].w) return Math.max(0.2, a[0].st * (x / a[0].w));
  if (x >= a[a.length - 1].w) return 99.95;
  for (let i = 0; i < a.length - 1; i++) {
    if (x >= a[i].w && x <= a[i + 1].w) {
      const f = (x - a[i].w) / (a[i + 1].w - a[i].w);
      return a[i].st + f * (a[i + 1].st - a[i].st);
    }
  }
  return 50;
}

function strengthPercentile(e1rm, stdKey) {
  const std = STRENGTH_STD[stdKey];
  if (!std || !e1rm) return null;
  // Within each sex: blend dedicated lifters with casuals (who lift ~30% less
  // at the same percentile — modeled by evaluating the lifter curve at x×1.45).
  const sexMix = (pts) =>
    (1 - GYM_POP.casualShare) * cdfFromAnchors(e1rm, pts) +
    GYM_POP.casualShare * cdfFromAnchors(e1rm * GYM_POP.casualFactor, pts);
  const strongerThan =
    (1 - GYM_POP.femaleShare) * sexMix(std.male) +
    GYM_POP.femaleShare * sexMix(std.female);
  const topPct = Math.min(99, Math.max(0.1, 100 - strongerThan));
  return { topPct, label: formatTopPct(topPct) };
}

// For a completed workout, return percentile info for each mapped lift performed.
function workoutPercentiles(w) {
  const out = [];
  const seen = new Set();
  w.exercises.forEach(ex => {
    const map = STD_MAP[ex.name];
    if (!map || seen.has(ex.name)) return;
    const logged = ex.sets.filter(s => s.logged);
    if (!logged.length) return;
    let bestE1 = 0;
    logged.forEach(s => {
      const e1 = est1RM(s.weight * map.factor, s.reps);
      if (e1 > bestE1) bestE1 = e1;
    });
    const pc = strengthPercentile(bestE1, map.std);
    if (!pc) return;
    seen.add(ex.name);
    out.push({ name: ex.name, stdLabel: STRENGTH_STD[map.std].label, e1: bestE1, ...pc });
  });
  return out;
}

// ============================================================================
// VO2 MAX PERCENTILE — vs all men & women (Cooper Institute, ages 20–29)
// Percentile → VO2 (ml/kg/min). Blended 50/50 male/female. Static, June 2026.
// ============================================================================
const VO2_NORMS = {
  male:   [[5, 29.0], [10, 32.1], [25, 40.1], [50, 48.0], [75, 55.2], [90, 61.8], [95, 66.3]],
  female: [[5, 21.7], [10, 23.9], [25, 30.5], [50, 37.6], [75, 44.7], [90, 51.3], [95, 56.0]]
};

function vo2StrongerThan(vo2, anchors) {
  const n = anchors.length;
  // extend below 5th and above 95th for extrapolation
  const pts = [[1, anchors[0][1] * 0.7], ...anchors,
    [99, anchors[n - 1][1] + (anchors[n - 1][1] - anchors[n - 2][1]) * 1.5],
    [99.9, anchors[n - 1][1] + (anchors[n - 1][1] - anchors[n - 2][1]) * 3.2]];
  if (vo2 <= pts[0][1]) return Math.max(0.3, pts[0][0] * (vo2 / pts[0][1]));
  if (vo2 >= pts[pts.length - 1][1]) return 99.9;
  for (let i = 0; i < pts.length - 1; i++) {
    if (vo2 >= pts[i][1] && vo2 <= pts[i + 1][1]) {
      const f = (vo2 - pts[i][1]) / (pts[i + 1][1] - pts[i][1]);
      return pts[i][0] + f * (pts[i + 1][0] - pts[i][0]);
    }
  }
  return 50;
}

function vo2Percentile(vo2) {
  if (!vo2) return null;
  const st = 0.5 * vo2StrongerThan(vo2, VO2_NORMS.male) + 0.5 * vo2StrongerThan(vo2, VO2_NORMS.female);
  const topPct = Math.min(99, Math.max(0.1, 100 - st));
  return { topPct, label: formatTopPct(topPct) };
}

// Best all-time estimated 1RM across any of the given exercise names.
function bestE1ForNames(names) {
  let best = 0;
  state.workouts.forEach(w => {
    w.exercises.forEach(ex => {
      if (!names.includes(ex.name)) return;
      ex.sets.filter(s => s.logged).forEach(s => {
        const e = est1RM(s.weight, s.reps);
        if (e > best) best = e;
      });
    });
  });
  return best;
}

// Most recent logged VO2 max (from daily check-ins).
function currentVo2() {
  const v = state.dailyCheckins.filter(c => c.vo2 != null).sort((a, b) => a.date.localeCompare(b.date));
  return v.length ? v[v.length - 1].vo2 : null;
}

// Color tier by "top %". Lower = better. Vibrant gradients defined in CSS.
function rankTierClass(topPct) {
  if (topPct == null) return "gray";
  if (topPct <= 2)  return "gold";
  if (topPct <= 10) return "purple";
  if (topPct <= 20) return "red";
  if (topPct <= 30) return "blue";
  if (topPct <= 40) return "green";
  return "gray";
}

// Build the 6 history ranking cards.
function rankCardsData() {
  const lift = (label, names, std) => {
    const e1 = bestE1ForNames(names);
    const pc = e1 ? strengthPercentile(e1, std) : null;
    return { name: label, value: e1 ? String(e1) : null, unit: "lb",
             topPct: pc ? pc.topPct : null, pctLabel: pc ? pc.label : null, pop: "gym-goers" };
  };
  const v = currentVo2();
  const vpc = v ? vo2Percentile(v) : null;
  return [
    lift("Bench", ["DB Bench Press", "Smith Bench Press (flat)"], "bench"),
    lift("Squat", ["Back Squat"], "squat"),
    lift("Deadlift", ["Hex Bar Deadlift"], "deadlift"),
    lift("Lat Pull", ["Lat Pulldown (neutral, narrow)", "Weighted Pull-Up / Lat Pulldown"], "latpull"),
    lift("Shoulder Press", ["Seated DB Shoulder Press"], "shoulder"),
    { name: "VO₂ Max", value: v ? String(v) : null, unit: "ml/kg",
      topPct: vpc ? vpc.topPct : null, pctLabel: vpc ? vpc.label : null, pop: "all men & women" }
  ];
}

function renderRankGrid() {
  const cards = rankCardsData();
  return `
    <div class="rank-grid">
      ${cards.map(c => {
        const cls = rankTierClass(c.topPct);
        const hasData = c.value != null;
        return `
        <div class="rank-card ${cls}">
          <div class="rank-name">${c.name}</div>
          <div class="rank-value">${hasData ? c.value : '—'}${hasData ? `<span> ${c.unit}</span>` : ''}</div>
          <div class="rank-pct">${hasData && c.pctLabel ? `${c.pctLabel} <span>${c.pop}</span>` : 'No data yet'}</div>
        </div>`;
      }).join("")}
    </div>
  `;
}

// ALL-TIME TOTAL VOLUME BANNER
// Sum of weight × reps for every logged set (including logged drop sets).
// Color tier by milestone. Static thresholds — easy to edit.
// ============================================================================
function totalVolumeAllTime() {
  let total = 0;
  state.workouts.forEach(w => {
    w.exercises.forEach(ex => {
      ex.sets.filter(s => s.logged).forEach(s => { total += (s.weight || 0) * (s.reps || 0); });
      const d = ex.dropSet;
      if (d && d.logged && d.weight && d.reps) total += d.weight * d.reps;
    });
  });
  return total;
}

function volumeTierClass(v) {
  if (v >= 5000000) return "gold";
  if (v >= 1000000) return "purple";
  if (v >= 500000)  return "blue";
  if (v >= 100000)  return "red";
  if (v >= 50000)   return "green";
  return "gray";
}

function nextVolumeMilestone(v) {
  const ms = [[50000, "Green"], [100000, "Red"], [500000, "Blue"], [1000000, "Purple"], [5000000, "Gold"]];
  for (const [t, name] of ms) if (v < t) return { remaining: t - v, name };
  return null;
}

function renderVolumeBanner() {
  const v = totalVolumeAllTime();
  const cls = volumeTierClass(v);
  const next = nextVolumeMilestone(v);
  const sub = next
    ? `${next.remaining.toLocaleString()} lb to ${next.name}`
    : "Top tier reached — Gold ★";
  return `
    <div class="vol-banner ${cls}">
      <div class="vol-label">Total Weight Lifted · All Time</div>
      <div class="vol-number">${v.toLocaleString()} <span>lb</span></div>
      <div class="vol-sub">${sub}</div>
    </div>
  `;
}

function findLastForExercise(dayKey, exerciseName) {
  for (let i = state.workouts.length - 1; i >= 0; i--) {
    const w = state.workouts[i];
    if (w.dayKey !== dayKey) continue;
    const ex = w.exercises.find(e => e.name === exerciseName);
    if (ex && ex.sets.some(s => s.logged)) return { workout: w, exercise: ex };
  }
  return null;
}

// Best logged set at a specific set position (index) for an exercise, by estimated
// 1RM, across every day it appears plus the in-progress workout. So set 1's "Best"
// reflects best-ever first sets, set 2's reflects best-ever second sets, etc.
function bestSetAtPosition(name, pos) {
  let best = null, bestE1 = 0;
  const scan = (w) => {
    if (!w || !w.exercises) return;
    w.exercises.forEach(exr => {
      if (exr.name !== name) return;
      const s = exr.sets[pos];
      if (!s || !s.logged || s.weight == null || s.reps == null) return;
      const e1 = est1RM(s.weight, s.reps);
      if (e1 > bestE1) { bestE1 = e1; best = s; }
    });
  };
  state.workouts.forEach(scan);
  scan(state.current);
  return best;
}

function suggestNext(dayKey, exDef) {
  const last = findLastForExercise(dayKey, exDef.name);
  if (!last) return null;

  const loggedSets = last.exercise.sets.filter(s => s.logged && s.weight != null);
  if (loggedSets.length === 0) return null;

  const topSet = loggedSets[0]; // first set is heaviest typically
  // Did ALL working sets hit top of rep range?
  const allHitTop = loggedSets.length >= exDef.sets &&
    loggedSets.every(s => s.reps >= exDef.repsHigh);

  const increment = exDef.isCompound ? 5 : 2.5;

  if (allHitTop) {
    return {
      weight: topSet.weight + increment,
      reps: exDef.repsLow,
      reason: `Hit top of range last time. +${increment} lb, drop to ${exDef.repsLow} reps.`,
      lastDate: last.workout.date
    };
  } else {
    return {
      weight: topSet.weight,
      reps: Math.min(topSet.reps + 1, exDef.repsHigh),
      reason: `Last time: ${topSet.weight} lb × ${topSet.reps}. Try +1 rep.`,
      lastDate: last.workout.date
    };
  }
}

// ============================================================================
let justCompletedExIdx = null; // keeps a just-finished exercise expanded (for optional drop set)

function startWorkout(dayKey) {
  const day = PLAN[dayKey];
  if (!day) return;

  let exercises = day.exercises.map(def => ({
    name: def.name,
    def: def,
    sets: Array.from({ length: def.sets }, (_, i) => ({
      idx: i + 1,
      weight: null,
      reps: null,
      rir: null,
      logged: false,
      timestamp: null
    })),
    dropSet: { weight: null, reps: null, rir: null, logged: false },
    notes: ""
  }));

  state.current = {
    dayKey,
    dayName: day.name,
    date: new Date().toISOString(),
    exercises,
    stretches: {},       // { stretchName: true } for checked items
    core: {},            // { coreName: true } for checked items (Wed/Fri only)
    addons: "",          // free text for ad-hoc extra lifts
    startedAt: Date.now(),
    completedAt: null
  };
  justCompletedExIdx = null;
  saveState();
  renderToday();
}

function logSet(exIdx, setIdx, weight, reps, rir) {
  const ex = state.current.exercises[exIdx];
  ex.sets[setIdx] = {
    ...ex.sets[setIdx],
    weight: weight,
    reps: reps,
    rir: rir,
    logged: true,
    timestamp: new Date().toISOString()
  };
  saveState();
}

function completeWorkout() {
  if (!state.current) return;
  state.current.completedAt = new Date().toISOString();
  state.workouts.push(state.current);

  const w = state.current;
  state.current = null;
  justCompletedExIdx = null;
  saveState();

  showWorkoutSummary(w);
}

function showWorkoutSummary(w) {
  const totalSets = w.exercises.reduce((sum, ex) => sum + ex.sets.filter(s => s.logged).length, 0);
  const totalVolume = w.exercises.reduce((sum, ex) =>
    sum + ex.sets.filter(s => s.logged).reduce((s2, set) => s2 + (set.weight * set.reps), 0), 0);
  const durationMin = Math.round((new Date(w.completedAt).getTime() - new Date(w.date).getTime()) / 60000);

  // Detect PRs (any set with higher est 1RM than ever before for that exercise)
  let prs = [];
  w.exercises.forEach(ex => {
    ex.sets.filter(s => s.logged).forEach(set => {
      const e1 = est1RM(set.weight, set.reps);
      const prevBest = previousBest1RM(w.dayKey, ex.name, w.date);
      if (e1 > prevBest) {
        prs.push({ name: ex.name, e1, weight: set.weight, reps: set.reps });
      }
    });
  });
  // unique PRs by exercise
  const seen = new Set();
  prs = prs.filter(p => { if (seen.has(p.name)) return false; seen.add(p.name); return true; });

  const cont = document.getElementById("todayContent");
  cont.innerHTML = `
    <div class="card">
      <div class="welcome" style="padding: 20px 0;">
        <div style="font-size: 32px; margin-bottom: 8px;">✓</div>

        <p>${w.dayName} · ${fmtDateLong(w.date)}</p>
      </div>
      <div class="summary-stat">
        <span class="label">Duration</span>
        <span class="value">${durationMin} min</span>
      </div>
      <div class="summary-stat">
        <span class="label">Working sets</span>
        <span class="value">${totalSets}</span>
      </div>
      <div class="summary-stat">
        <span class="label">Total volume</span>
        <span class="value">${totalVolume.toLocaleString()} lb</span>
      </div>
      <div class="summary-stat">
        <span class="label">Personal records</span>
        <span class="value ${prs.length ? 'accent-text' : ''}">${prs.length}</span>
      </div>
    </div>

    ${prs.length ? `
      <div class="card">
        <div class="card-title">New PRs</div>
        ${prs.map(p => `
          <div style="padding: 8px 0; border-bottom: 1px solid var(--border);">
            <div style="font-weight: 600; font-size: 15px;">${p.name}</div>
            <div class="small mono" style="margin-top: 2px;">${p.weight} lb × ${p.reps} reps · est 1RM ${p.e1} lb</div>
          </div>
        `).join("")}
      </div>
    ` : ""}

    ${(() => {
      const pcs = workoutPercentiles(w);
      if (!pcs.length) return "";
      return `
        <div class="card">
          <div class="card-title">How You Stack Up</div>
          <div class="small" style="color: var(--text-dim); margin-bottom: 10px;">
            Best est. 1RM today vs. everyone at the gym — all sexes, sizes, and experience levels. Estimated, for fun.
          </div>
          ${pcs.map(p => `
            <div style="padding: 10px 0; border-bottom: 1px solid var(--border);">
              <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px;">
                <div style="font-weight: 600; font-size: 15px;">${p.name}</div>
                <div class="accent-text" style="font-weight: 700; white-space: nowrap;">${p.label} of all gym-goers</div>
              </div>

                ${p.stdLabel} basis · est 1RM ${p.e1} lb
              </div>
            </div>
          `).join("")}
        </div>
      `;
    })()}

    <button class="btn" onclick="renderToday()">Back to Today</button>
  `;
}

function previousBest1RM(dayKey, exName, beforeDate) {
  let best = 0;
  state.workouts.forEach(w => {
    if (w.dayKey !== dayKey) return;
    if (new Date(w.date) >= new Date(beforeDate)) return;
    const ex = w.exercises.find(e => e.name === exName);
    if (!ex) return;
    ex.sets.filter(s => s.logged).forEach(s => {
      const e1 = est1RM(s.weight, s.reps);
      if (e1 > best) best = e1;
    });
  });
  return best;
}

function discardWorkout() {
  if (!state.current) return;
  if (!confirm("Discard this workout? Logged sets will be lost.")) return;
  state.current = null;
  justCompletedExIdx = null;
  saveState();
  renderToday();
}

// ============================================================================
// REST TIMER
// ============================================================================
let activeView = "today";          // which tab is showing (for day-rollover refresh)
let lastRenderDay = null;          // local date the active view was last rendered

let timerState = {
  endTime: 0,      // wall-clock ms (Date.now) when the rest period ends
  target: 0,       // total seconds (for the "Target" label)
  intervalId: null,
  active: false,
  finished: false  // guard so the buzz/flash fires only once
};

function timerRemaining() {
  return Math.max(0, Math.round((timerState.endTime - Date.now()) / 1000));
}

function startTimer(seconds) {
  timerState.target = seconds;
  timerState.endTime = Date.now() + seconds * 1000;   // anchored to the real clock
  timerState.active = true;
  timerState.finished = false;

  const overlay = document.getElementById("timerOverlay");
  overlay.classList.add("show");
  overlay.classList.remove("done", "flash");
  document.getElementById("timerTarget").textContent = "Target: " + fmtMMSS(seconds);
  updateTimerDisplay();

  if (timerState.intervalId) clearInterval(timerState.intervalId);
  timerState.intervalId = setInterval(tickTimer, 250);
  acquireWakeLock();
}

function tickTimer() {
  if (!timerState.active) return;
  updateTimerDisplay();
  if (timerRemaining() <= 0) finishTimer();
}

function updateTimerDisplay() {
  const el = document.getElementById("timerDisplay");
  if (el) el.textContent = fmtMMSS(timerRemaining());
}

function finishTimer() {
  if (timerState.finished) return;   // fire once only
  timerState.finished = true;
  if (timerState.intervalId) clearInterval(timerState.intervalId);
  timerState.intervalId = null;
  timerState.active = false;
  updateTimerDisplay();

  const overlay = document.getElementById("timerOverlay");
  overlay.classList.add("done", "flash");
  vibrate([300, 100, 300, 100, 300]);

  releaseWakeLock();
  setTimeout(() => {
    overlay.classList.remove("show", "flash", "done");
  }, 2000);
}

function skipTimer() {
  if (timerState.intervalId) clearInterval(timerState.intervalId);
  timerState.intervalId = null;
  timerState.active = false;
  timerState.finished = true;
  releaseWakeLock();
  document.getElementById("timerOverlay").classList.remove("show", "done", "flash");
}

function addTime() {
  timerState.endTime += 30000;
  timerState.target += 30;
  document.getElementById("timerTarget").textContent = "Target: " + fmtMMSS(timerState.target);
  updateTimerDisplay();
}

// Keep the screen awake while a rest timer runs so the buzz/flash fires on
// time (otherwise iOS may sleep the screen and suspend the page). Auto-released
// by the OS when the app is hidden; we re-acquire on return if still resting.
let wakeLock = null;
async function acquireWakeLock() {
  try {
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  } catch (e) { /* not supported or denied — timer still reconciles on return */ }
}
function releaseWakeLock() {
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  wakeLock = null;
}

// When the app/screen comes back to the foreground, reconcile against the real
// clock: JS pauses while backgrounded, so recompute from endTime and fire the
// alert immediately if the rest period elapsed while we were away.
function reconcileTimer() {
  if (!timerState.active) return;
  updateTimerDisplay();
  if (timerRemaining() <= 0) finishTimer();
  else acquireWakeLock();
}

// PWAs stay suspended for days: a view rendered "yesterday" still shows
// yesterday's date, recommended lift, and check-in form. On return, if the
// calendar day changed, re-render the active view fresh.
function onAppForeground() {
  reconcileTimer();
  if (todayIsoDate() !== lastRenderDay) {
    lastRenderDay = todayIsoDate();
    switchView(activeView);
  }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) onAppForeground(); });
window.addEventListener("focus", onAppForeground);
window.addEventListener("pageshow", onAppForeground);

document.getElementById("timerSkip").addEventListener("click", skipTimer);
document.getElementById("timerAdd").addEventListener("click", addTime);

function wireStretchListeners() {
  const toggleAll = document.getElementById("stretchToggleAll");
  if (toggleAll) {
    toggleAll.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const allChecked = STRETCHES.every(s => state.current.stretches[s]);
      if (allChecked) {
        state.current.stretches = {};
      } else {
        STRETCHES.forEach(s => { state.current.stretches[s] = true; });
        vibrate(20);
      }
      saveState();
      // Re-sync the checkboxes + button label without a full re-render
      document.querySelectorAll("[data-stretch]").forEach(label => {
        const name = STRETCHES[parseInt(label.dataset.stretch)];
        const on = !!state.current.stretches[name];
        label.classList.toggle("checked", on);
        const cb = label.querySelector("input"); if (cb) cb.checked = on;
      });
      toggleAll.textContent = allChecked ? "Check all" : "Clear all";
    });
  }
  document.querySelectorAll("[data-stretch]").forEach(label => {
    label.addEventListener("click", (e) => {
      e.preventDefault();
      const idx = parseInt(label.dataset.stretch);
      const name = STRETCHES[idx];
      if (state.current.stretches[name]) {
        delete state.current.stretches[name];
        label.classList.remove("checked");
        label.querySelector("input").checked = false;
      } else {
        state.current.stretches[name] = true;
        label.classList.add("checked");
        label.querySelector("input").checked = true;
        vibrate(20);
      }
      const tgl = document.getElementById("stretchToggleAll");
      if (tgl) tgl.textContent = STRETCHES.every(s => state.current.stretches[s]) ? "Clear all" : "Check all";
      saveState();
    });
  });
}

function wireCoreListeners() {
  document.querySelectorAll("[data-core]").forEach(label => {
    label.addEventListener("click", (e) => {
      e.preventDefault();
      const idx = parseInt(label.dataset.core);
      const name = coreForDay(state.current.dayKey)[idx];
      if (!state.current.core) state.current.core = {};
      if (state.current.core[name]) {
        delete state.current.core[name];
        label.classList.remove("checked");
        label.querySelector("input").checked = false;
      } else {
        state.current.core[name] = true;
        label.classList.add("checked");
        label.querySelector("input").checked = true;
        vibrate(20);
      }
      saveState();
    });
  });
}

function wireAddonsListener() {
  const ta = document.getElementById("addonsBox");
  if (!ta) return;
  ta.addEventListener("input", () => {
    state.current.addons = ta.value;
    saveState();
  });
}

function restTier(restSec) {
  if (!restSec) return null;
  if (restSec >= 150) return "green";   // heavy + upper-moderate compounds (longest rest)
  if (restSec >= 120) return "yellow";  // secondary compounds (mid)
  return "red";                         // isolation (now floored at 90s — shortest rest)
}

function renderExerciseCard(ex, idx, isCurrent) {
  const def = ex.def;
  const isDone = ex.sets.every(s => s.logged);
  const isOpen = (isCurrent && !isDone) || idx === justCompletedExIdx;
  const suggestion = suggestNext(state.current.dayKey, def);
  const patternKey = EX_PATTERN[ex.name] || EX_PATTERN[def.name];
  const svg = patternKey ? EX_SVG[patternKey] : "";
  const ytQuery = encodeURIComponent(ex.name + " form proper");
  const tier = restTier(def.restSec);

  // Previous session for this exercise (for per-set "last time" reference)
  const last = findLastForExercise(state.current.dayKey, ex.name);
  const lastSets = last ? last.exercise.sets.filter(s => s.logged) : [];
  const lastDropObj = last && last.exercise.dropSet && last.exercise.dropSet.logged ? last.exercise.dropSet : null;
  const lastDrop = lastDropObj
    ? `${lastDropObj.weight} lb × ${lastDropObj.reps}${lastDropObj.rir != null ? ' @ RIR ' + lastDropObj.rir : ''}`
    : null;
  const drop = ex.dropSet || { logged: false };
  const dropDone = drop.logged || drop.skipped;

  return `

function wireExerciseListeners() {
  // Header toggle
  document.querySelectorAll("[data-toggle]").forEach(h => {
    h.addEventListener("click", () => {
      const exEl = h.closest(".exercise");
      exEl.classList.toggle("open");
    });
  });

  // Log buttons
  document.querySelectorAll("[data-log]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      justCompletedExIdx = null;
      const [exIdx, sIdx] = btn.dataset.log.split("-").map(Number);
      const row = btn.closest(".set-row");
      const wInput = row.querySelector("[data-field='weight']");
      let weight = parseFloat(wInput.value);
      if (isNaN(weight)) {
        // Left blank → use the grayed placeholder (last week's / suggested weight)
        const pf = parseFloat(wInput.dataset.prefill);
        if (!isNaN(pf)) weight = pf;
      }
      const reps = parseInt(row.querySelector("[data-field='reps']").value);
      const rirVal = row.querySelector("[data-field='rir']").value;
      const rir = rirVal === "" ? null : parseInt(rirVal);

      if (!weight || !reps) {
        toast("Enter weight and reps");
        return;
      }

      logSet(exIdx, sIdx, weight, reps, rir);
      wInput.value = weight;
      btn.classList.add("logged");
      btn.textContent = "✓";
      row.classList.add("logged");
      vibrate(40);
      toast(`Set ${sIdx + 1} logged · ${weight} × ${reps}`);

      // If this finished the exercise, keep it open (so a drop set can be added) and re-render
      const currentEx = state.current.exercises[exIdx];
      const allDone = currentEx.sets.every(s => s.logged);
      if (allDone) {
        justCompletedExIdx = exIdx;
        setTimeout(() => renderToday(), 500);
      } else {
        refreshProgressBars();
      }
    });
  });

  // Drop set / finisher button — never required. Tapping it finishes the exercise.
  document.querySelectorAll("[data-drop]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const exIdx = parseInt(btn.dataset.drop);
      const row = btn.closest(".drop-row");
      const weight = parseFloat(row.querySelector("[data-dfield='weight']").value);
      const reps = parseInt(row.querySelector("[data-dfield='reps']").value);
      const rirVal = row.querySelector("[data-dfield='rir']").value;
      const rir = rirVal === "" ? null : parseInt(rirVal);

      if (weight && reps) {
        state.current.exercises[exIdx].dropSet = { weight, reps, rir, logged: true, skipped: false };
        toast(`Drop set logged · ${weight} × ${reps}`);
      } else {
        // No data entered — acknowledge as complete (green) without storing numbers
        state.current.exercises[exIdx].dropSet = { weight: null, reps: null, rir: null, logged: false, skipped: true };
        toast("Exercise complete");
      }
      justCompletedExIdx = null;   // collapse this card and advance to the next exercise
      saveState();
      btn.classList.add("logged");
      btn.textContent = "✓";
      row.classList.add("logged");
      vibrate(40);
      setTimeout(() => renderToday(), 350);   // brief green flash, then minimize + open next
    });
  });

  // Notes
  document.querySelectorAll("[data-notes]").forEach(ta => {
    ta.addEventListener("input", (e) => {
      const idx = parseInt(ta.dataset.notes);
      state.current.exercises[idx].notes = ta.value;
      saveState();
    });
  });

  // Rest timer buttons
  document.querySelectorAll("[data-rest]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const sec = parseInt(btn.dataset.rest);
      startTimer(sec);
    });
  });

  // Stop click propagation from inputs
  document.querySelectorAll(".ex-body input, .ex-body select, .ex-body textarea").forEach(el => {
    el.addEventListener("click", e => e.stopPropagation());
  });
}

function refreshProgressBars() {
  const w = state.current;
  if (!w) return;
  let currentIdx = w.exercises.findIndex(ex => !ex.sets.every(s => s.logged));
  if (currentIdx === -1) currentIdx = w.exercises.length - 1;

  document.querySelectorAll(".ex-progress-bar").forEach((bar, i) => {
    const done = w.exercises[i].sets.every(s => s.logged);
    bar.classList.toggle("done", done);
    bar.classList.toggle("current", !done && i === currentIdx);
  });

  // Update exercise state classes
  document.querySelectorAll(".exercise").forEach((el, i) => {
    const done = w.exercises[i].sets.every(s => s.logged);
    el.classList.toggle("done", done);
    el.classList.toggle("current", !done && i === currentIdx);
  });

  // Update done counter
  const doneEx = w.exercises.filter(ex => ex.sets.every(s => s.logged)).length;
  const counter = document.querySelector(".card-tight .small");
  if (counter) counter.textContent = `${doneEx}/${w.exercises.length} exercises complete`;
}

let currentChartType = "weight"; // "weight" | "volume" | "e1rm"
let chartInstance = null;

function renderExerciseDetail(cont) {
  const { dayKey, exerciseName } = historyFocus;

  // Collect all sessions
  const sessions = [];
  state.workouts
    .filter(w => w.dayKey === dayKey)
    .sort((a, b) => new Date(a.date) - new Date(b.date))
    .forEach(w => {
      const ex = w.exercises.find(e => e.name === exerciseName);
      if (!ex) return;
      const logged = ex.sets.filter(s => s.logged);
      if (logged.length === 0) return;
      const topSet = logged.reduce((max, s) => s.weight > max.weight ? s : max, logged[0]);
      const volume = logged.reduce((sum, s) => sum + s.weight * s.reps, 0);
      const best1RM = Math.max(...logged.map(s => est1RM(s.weight, s.reps)));
      sessions.push({
        date: w.date,
        topWeight: topSet.weight,
        topReps: topSet.reps,
        volume,
        e1rm: best1RM,
        sets: logged,
        dropSet: (ex.dropSet && ex.dropSet.logged) ? ex.dropSet : null
      });
    });

  cont.innerHTML = `
    <button class="detail-back" onclick="historyFocus = null; renderHistory();">← Back</button>
    <div class="card">
      <div style="font-size: 18px; font-weight: 700; margin-bottom: 4px;">${exerciseName}</div>
      <div class="small" style="margin-bottom: 14px;">${PLAN[dayKey].name} · ${sessions.length} sessions</div>

      <div class="chart-tabs">

        <button class="chart-tab ${currentChartType === 'volume' ? 'active' : ''}" data-chart="volume">Volume</button>
        <button class="chart-tab ${currentChartType === 'e1rm' ? 'active' : ''}" data-chart="e1rm">Est 1RM</button>
      </div>

      <div class="chart-wrap">
        <canvas id="exChart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Session Log</div>
      ${sessions.slice().reverse().map(s => `
        <div style="padding: 10px 0; border-bottom: 1px solid var(--border);">
          <div style="display:flex; justify-content: space-between; align-items: baseline;">
            <div class="small mono">${fmtDate(s.date)}</div>
            <div class="mono" style="font-weight: 600;">Top: ${s.topWeight} × ${s.topReps}</div>
          </div>
          <div class="small mono" style="margin-top: 4px; color: var(--text-muted);">
            ${s.sets.map(set => `${set.weight}×${set.reps}${set.rir != null ? '@' + set.rir : ''}`).join(' · ')}

          </div>
        </div>
      `).join("")}
    </div>
  `;

  drawChart(sessions);

  cont.querySelectorAll("[data-chart]").forEach(btn => {

      cont.querySelectorAll(".chart-tab").forEach(t => t.classList.remove("active"));

  });

function drawChart(sessions) {
  const canvas = document.getElementById("exChart");
  if (!canvas) return;
  if (chartInstance) chartInstance.destroy();

  const labels = sessions.map(s => fmtDate(s.date));

function getTodayCheckin() {
  const today = todayIsoDate();
  return state.dailyCheckins.find(c => c.date === today) || null;

function readinessSignal(c) {
  // Plan thresholds:
  // Body Battery (AM): > 50 green, 30-50 yellow, < 30 red
  // Sleep Score: > 75 green, 60-75 yellow, < 60 red
  // HRV: needs baseline - we'll compare against 14-day average
  if (!c) return { color: "var(--text-muted)", label: "—", desc: "No check-in" };

  let flags = 0;
  let bigFlags = 0;
  let notes = [];

  if (c.bodyBattery != null) {
    if (c.bodyBattery < 30) { bigFlags++; notes.push("body battery low"); }
    else if (c.bodyBattery < 50) { flags++; notes.push("body battery moderate"); }
  }
  if (c.sleepScore != null) {
    if (c.sleepScore < 60) { bigFlags++; notes.push("sleep poor"); }
    else if (c.sleepScore < 75) { flags++; notes.push("sleep okay"); }
  }
  // HRV: compare to 14-day average
  if (c.hrv != null) {
    const recent = state.dailyCheckins
      .filter(x => x.hrv != null && x.date < c.date)
      .sort((a, b) => a.date.localeCompare(b.date))
      .slice(-14);
    if (recent.length >= 5) {
      const avg = recent.reduce((s, x) => s + x.hrv, 0) / recent.length;
      if (c.hrv < avg * 0.85) { bigFlags++; notes.push("HRV well below baseline"); }
      else if (c.hrv < avg * 0.95) { flags++; notes.push("HRV slightly below"); }
    }
  }

  if (bigFlags >= 2 || (bigFlags >= 1 && flags >= 1)) {
    return { color: "var(--danger)", label: "RED", desc: "Rest or deload. " + notes.join("; ") };
  }
  if (bigFlags >= 1 || flags >= 2) {
    return { color: "var(--warn)", label: "YELLOW", desc: "Reduce intensity. " + notes.join("; ") };
  }
  if (flags >= 1) {
    return { color: "var(--warn)", label: "YELLOW", desc: notes.join("; ") };
  }
  return { color: "var(--success)", label: "GREEN", desc: "Cleared to train hard." };
}

function renderDaily() {
  const cont = document.getElementById("dailyContent");
  const today = getTodayCheckin();
  const readiness = readinessSignal(today);
  document.getElementById("dailyDate").textContent = today ? "LOGGED" : "PENDING";

  const list = [...state.dailyCheckins].sort((a, b) => new Date(a.date) - new Date(b.date));

    ${list.length >= 2 ? `

        <div class="card-title">HRV Trend</div>
        <div class="chart-wrap"><canvas id="hrvChart"></canvas></div>

      <div class="card">

function parseIntOrNull(v) {
  const n = parseInt(v);
  return isNaN(n) ? null : n;
}

function parseFloatOrNull(v) {
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

function drawDailyChart(canvasId, list, field, label, color, instKey) {
  const filtered = list.filter(c => c[field] != null);
  if (filtered.length < 2) return;
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  if (dailyCharts[instKey]) dailyCharts[instKey].destroy();

  dailyCharts[instKey] = new Chart(canvas, {
    type: "line",
    data: {
      labels: filtered.map(c => fmtDate(c.date)),
      datasets: [{
        label,
        data: filtered.map(c => c[field]),
        borderColor: color,
        backgroundColor: color + "20",
        borderWidth: 2.5,
        tension: 0.3,
        pointRadius: 3,
        pointBackgroundColor: color,
        pointBorderColor: "#0a0a0a",
        pointBorderWidth: 2,
        fill: true
      }]
    },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { backgroundColor: "#222" } },
      scales: {
        x: { grid: { color: "#1a1a1a" }, ticks: { color: "#666", font: { size: 10 } } },
        y: { grid: { color: "#1a1a1a" }, ticks: { color: "#666", font: { size: 10 } } }
      }
    }
  });
}

const RUN_TYPES = [
  { id: "easy", name: "Easy / Z2", color: "#10b981" },
  { id: "vo2", name: "VO2 Intervals", color: "#ef4444" },
  { id: "long", name: "Long Run", color: "#3b82f6" },
  { id: "tempo", name: "Tempo", color: "#f59e0b" },
  { id: "recovery", name: "Recovery", color: "#94a3b8" },
  { id: "race", name: "Race / Time Trial", color: "#a855f7" }
];

function renderRun() {
  const cont = document.getElementById("runContent");
  document.getElementById("runCount").textContent = state.runs.length + " RUNS";

  const totalMiles = state.runs.reduce((s, r) => s + (r.distance || 0), 0);
  const weekRuns = state.runs.filter(r => (Date.now() - new Date(r.date).getTime()) < 7 * 86400000);
  const weekMiles = weekRuns.reduce((s, r) => s + (r.distance || 0), 0);

  // Today's recommendation
  const dow = new Date().getDay();
  const todayPlan = RUN_PLAN[dow];
  const dayName = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dow];

  // Count VO2 sessions for rotation (modulo 4)
  const vo2Count = state.runs.filter(r => r.type === "vo2").length;
  const vo2Next = VO2_ROTATION[vo2Count % 4];

  cont.innerHTML = `
    <div class="card run-rec-card">
      <div class="card-title">${dayName} · Recommended</div>
      <div class="run-rec-title">${todayPlan.title}</div>
      <div class="run-rec-details">${todayPlan.details}</div>
      <div class="run-rec-pace mono">Target pace: ${todayPlan.pace}</div>
      ${todayPlan.type === "vo2" ? `
        <div class="run-rec-vo2">
          <div class="vo2-week-label">Next VO2 workout</div>
          <div class="vo2-week-name">${vo2Next.name}</div>
          <div class="vo2-week-details mono">${vo2Next.details}</div>
        </div>
      ` : ""}
    </div>

    <div class="card">
      <div class="card-title">Log Run</div>
      <div class="run-type-grid" id="runTypeGrid">
        ${RUN_TYPES.map(t => `
          <button class="run-type" data-rtype="${t.id}">${t.name}</button>
        `).join("")}
      </div>
      <div class="form-row">
        <div>
          <div class="form-label">Distance (mi)</div>
          <input type="number" inputmode="decimal" step="0.1" class="bw-input" id="runDist" placeholder="5.0">
        </div>
        <div>
          <div class="form-label">Time (MM:SS or HH:MM:SS)</div>
          <input type="text" inputmode="numeric" class="bw-input" id="runTime" placeholder="40:00">
        </div>
      </div>
      <div class="form-row">
        <div style="grid-column: 1 / -1;">
          <div class="form-label">Notes</div>
          <textarea class="ex-notes-input" id="runNotes" placeholder="Felt smooth, slight foot tightness, etc..." style="margin-top: 0;"></textarea>
        </div>
      </div>
      <button class="btn" id="runLog" style="margin-top: 8px;">Log Run</button>
    </div>

    <div class="stat-grid">
      <div class="stat">
        <div class="stat-label">This week</div>
        <div class="stat-value">${weekMiles.toFixed(1)}<span style="font-size:12px;"> mi</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">All time</div>
        <div class="stat-value">${totalMiles.toFixed(0)}<span style="font-size:12px;"> mi</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">Sessions</div>
        <div class="stat-value">${state.runs.length}</div>
      </div>
    </div>

    ${state.runs.length ? `
      <div class="card">
        <div class="card-title">History</div>
        ${[...state.runs].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 20).map(r => {
          const type = RUN_TYPES.find(t => t.id === r.type) || { name: r.type, color: "#999" };
          const pace = r.distance && r.timeSec ? secsToPace(r.timeSec / r.distance) : null;
          return `
            <div style="padding: 12px 0; border-bottom: 1px solid var(--border);">
              <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <div>
                  <span style="display:inline-block; width: 8px; height: 8px; border-radius: 50%; background: ${type.color}; margin-right: 6px;"></span>
                  <span style="font-weight: 600;">${type.name}</span>
                </div>
                <div class="small mono">${fmtDate(r.date)}</div>
              </div>
              <div class="small mono" style="margin-top: 6px;">
                ${r.distance ? r.distance.toFixed(1) + " mi" : ""}
                ${r.time ? " · " + r.time : ""}
                ${pace ? " · " + pace + "/mi" : ""}
              </div>
              ${r.notes ? `<div class="small" style="margin-top: 4px; color: var(--text-dim);">${esc(r.notes)}</div>` : ""}
            </div>
          `;
        }).join("")}
      </div>
    ` : `
      <div class="empty"><div class="empty-icon">🏃</div><div>No runs logged.</div></div>
    `}
  `;

  let selectedType = todayPlan.type;
  document.querySelectorAll(".run-type").forEach(btn => {
    if (btn.dataset.rtype === selectedType) btn.classList.add("active");
    btn.addEventListener("click", () => {
      document.querySelectorAll(".run-type").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedType = btn.dataset.rtype;
    });
  });

  // Auto-format the time field: type digits, the colon appears for you.
  // "4922" -> "49:22"; five+ digits -> H:MM:SS.
  const runTimeEl = document.getElementById("runTime");
  if (runTimeEl) {
    runTimeEl.addEventListener("input", () => {
      let d = runTimeEl.value.replace(/\D/g, "").slice(0, 6);
      let out;
      if (d.length <= 2) {
        out = d;
      } else if (d.length <= 4) {
        out = d.slice(0, d.length - 2) + ":" + d.slice(-2);
      } else {
        out = d.slice(0, d.length - 4) + ":" + d.slice(-4, -2) + ":" + d.slice(-2);
      }
      runTimeEl.value = out;
    });
  }

  document.getElementById("runLog").addEventListener("click", () => {
    const dist = parseFloat(document.getElementById("runDist").value) || null;
    const timeStr = document.getElementById("runTime").value.trim();
    const notes = document.getElementById("runNotes").value.trim();
    const timeSec = parseTimeToSec(timeStr);
    if (!dist && !timeStr) {
      toast("Enter distance or time");
      return;
    }
    state.runs.push({
      date: new Date().toISOString(),
      type: selectedType,
      distance: dist,
      time: timeStr || null,
      timeSec: timeSec,
      notes: notes || null
    });
    saveState();
    toast("Run logged");
    vibrate(40);
    renderRun();
  });
}

function parseTimeToSec(str) {
  if (!str) return null;
  const parts = str.split(":").map(p => parseInt(p));
  if (parts.some(isNaN)) return null;
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  return null;
}
function secsToPace(secPerMi) {
  const m = Math.floor(secPerMi / 60);
  const s = Math.round(secPerMi % 60);
  return m + ":" + String(s).padStart(2, "0");
}

    renderData();
    renderToday();
    toast("All data cleared");
  });
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  downloadBlob(blob, "liftlog-backup-" + todayIsoDate() + ".json");
}

function exportCSV() {
  const rows = [["Date", "Day", "Exercise", "Set", "Weight (lb)", "Reps", "RIR", "Volume (lb)", "Est 1RM", "Notes"]];
  state.workouts.forEach(w => {
    w.exercises.forEach(ex => {
      ex.sets.filter(s => s.logged).forEach(s => {
        rows.push([
          localIsoDate(w.date),
          w.dayName,
          ex.name,
          s.idx,
          s.weight,
          s.reps,
          s.rir ?? "",
          s.weight * s.reps,
          est1RM(s.weight, s.reps),
          (ex.notes || "").replace(/"/g, '""')
        ]);
      });
      // Drop set row if logged
      if (ex.dropSet && ex.dropSet.logged) {
        rows.push([
          localIsoDate(w.date),
          w.dayName,
          ex.name,
          "drop",
          ex.dropSet.weight,
          ex.dropSet.reps,
          ex.dropSet.rir ?? "",
          ex.dropSet.weight * ex.dropSet.reps,
          "",
          "drop set"
        ]);
      }
    });
    // Add-on lifts row if present
    if (w.addons && w.addons.trim()) {
      rows.push([
        localIsoDate(w.date),
        w.dayName,
        "[ADD-ONS]",
        "",
        "",
        "",
        "",
        "",
        "",
        w.addons.replace(/"/g, '""')
      ]);
    }
  });
  const csv = rows.map(r => r.map(c => `"${c}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  downloadBlob(blob, "liftlog-export-" + todayIsoDate() + ".csv");
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("Exported " + filename);
}

function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!confirm("Replace current data with imported file?")) return;
      state = { ...defaultState(), ...data };
      saveState();
      toast("Data imported");
      renderData();
      renderToday();
    } catch (err) {
      toast("Invalid file");
    }
  };
  reader.readAsText(file);
}

// ============================================================================
// NAVIGATION
// ============================================================================
function switchView(view) {
  activeView = view;
  lastRenderDay = todayIsoDate();
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("view-" + view).classList.add("active");
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.view === view));

  if (view === "today") renderToday();
  if (view === "history") { historyFocus = null; renderHistory(); }
  if (view === "daily") renderDaily();
  if (view === "run") renderRun();
  if (view === "data") renderData();

  window.scrollTo(0, 0);
}

document.querySelectorAll(".nav-item").forEach(item => {
  item.addEventListener("click", () => switchView(item.dataset.view));
});

// ============================================================================
// INIT
// ============================================================================
window.discardWorkout = discardWorkout;
window.completeWorkout = completeWorkout;
window.startWorkout = startWorkout;
window.renderToday = renderToday;
window.renderHistory = renderHistory;

lastRenderDay = todayIsoDate();
// Ask the browser to protect localStorage from eviction (iOS can purge
// storage for sites unused ~7 days; this request makes that much less likely).
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}

renderToday();

// Prevent zoom on iOS double-tap
let lastTouch = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });
</script>
